<svg width="1200" height="450"
viewBox="0 0 1200 450"
xmlns="http://www.w3.org/2000/svg">


<defs>

<!-- Background -->
<linearGradient id="background"
x1="0"
y1="0"
x2="1"
y2="1">

<stop offset="0%" stop-color="#020617"/>
<stop offset="50%" stop-color="#0b1224"/>
<stop offset="100%" stop-color="#111827"/>

</linearGradient>


<!-- Glass -->
<linearGradient id="glass"
x1="0"
y1="0"
x2="1"
y2="1">

<stop stop-color="#ffffff" stop-opacity="0.12"/>
<stop offset="1" stop-color="#38bdf8" stop-opacity="0.05"/>

</linearGradient>


<!-- Cyan -->
<linearGradient id="cyan">

<stop stop-color="#22d3ee"/>
<stop offset="50%" stop-color="#38bdf8"/>
<stop offset="100%" stop-color="#2563eb"/>

</linearGradient>


<!-- Text -->

<linearGradient id="title">

<stop stop-color="#ffffff"/>
<stop offset="0.45" stop-color="#67e8f9"/>
<stop offset="1" stop-color="#818cf8"/>

</linearGradient>


<!-- Glow -->

<filter id="glow">

<feGaussianBlur stdDeviation="6"
result="blur"/>

<feMerge>
<feMergeNode in="blur"/>
<feMergeNode in="SourceGraphic"/>
</feMerge>

</filter>


<!-- Strong Glow -->

<filter id="strongGlow">

<feGaussianBlur stdDeviation="15"
result="blur"/>

<feMerge>
<feMergeNode in="blur"/>
<feMergeNode in="SourceGraphic"/>
</feMerge>

</filter>


</defs>



<!-- BACKGROUND -->

<rect width="1200"
height="450"
rx="30"
fill="url(#background)"/>



<!-- GRID -->

<g opacity="0.08"
stroke="#38bdf8">


<path d="
M0 80H1200
M0 160H1200
M0 240H1200
M0 320H1200
M0 400H1200
"/>


<path d="
M150 0V450
M300 0V450
M450 0V450
M600 0V450
M750 0V450
M900 0V450
M1050 0V450
"/>


</g>



<!-- MOVING DATA STREAMS -->

<g stroke="#38bdf8"
stroke-width="2"
opacity="0.4">


<path d="M0 130H350">

<animate attributeName="stroke-dasharray"
values="0 400;400 0"
dur="3s"
repeatCount="indefinite"/>

</path>


<path d="M850 300H1200">

<animate attributeName="stroke-dasharray"
values="400 0;0 400"
dur="4s"
repeatCount="indefinite"/>

</path>


</g>



<!-- HEADER -->

<text
x="600"
y="70"
text-anchor="middle"
font-family="monospace"
font-size="42"
font-weight="900"
fill="url(#title)">

Riku Kato

</text>



<text
x="600"
y="105"
text-anchor="middle"
font-family="monospace"
font-size="20"
fill="#bae6fd">

SENIOR AI FULL STACK ENGINEER

</text>



<!-- ARCHITECTURE LAYERS -->


<!-- LEFT NODE -->

<rect
x="90"
y="180"
width="180"
height="80"
rx="18"
fill="url(#glass)"
stroke="#38bdf8"
opacity="0.9"/>


<text
x="180"
y="215"
text-anchor="middle"
fill="#67e8f9"
font-family="monospace"
font-size="18"
font-weight="bold">

ENGINEER

</text>


<text
x="180"
y="240"
text-anchor="middle"
fill="white"
font-family="monospace"
font-size="14">

Scalable Data Platforms

</text>



<!-- LEFT MIDDLE -->

<rect
x="320"
y="180"
width="180"
height="80"
rx="18"
fill="url(#glass)"
stroke="#38bdf8"/>


<text
x="410"
y="215"
text-anchor="middle"
fill="#67e8f9"
font-family="monospace"
font-size="18"
font-weight="bold">

TRANSFORM

</text>


<text
x="410"
y="240"
text-anchor="middle"
fill="white"
font-family="monospace"
font-size="14">

Data into Insights

</text>



<!-- RIGHT MIDDLE -->


<rect
x="700"
y="180"
width="180"
height="80"
rx="18"
fill="url(#glass)"
stroke="#38bdf8"/>


<text
x="790"
y="215"
text-anchor="middle"
fill="#67e8f9"
font-family="monospace"
font-size="18"
font-weight="bold">

ENABLE

</text>


<text
x="790"
y="240"
text-anchor="middle"
fill="white"
font-family="monospace"
font-size="14">

Data Driven AI

</text>



<!-- RIGHT -->


<rect
x="930"
y="180"
width="180"
height="80"
rx="18"
fill="url(#glass)"
stroke="#38bdf8"/>


<text
x="1020"
y="215"
text-anchor="middle"
fill="#67e8f9"
font-family="monospace"
font-size="18"
font-weight="bold">

BUILD

</text>


<text
x="1020"
y="240"
text-anchor="middle"
fill="white"
font-family="monospace"
font-size="14">

Cloud Native Systems

</text>



<!-- CONNECTIONS -->


<g stroke="#38bdf8"
stroke-width="2"
filter="url(#glow)">



<path d="
M270 220
H320
"/>


<path d="
M500 220
H600
"/>


<path d="
M600 220
H700
"/>


<path d="
M880 220
H930
"/>


</g>



<!-- CENTRAL AI CORE -->

<circle
cx="600"
cy="220"
r="70"
fill="#0ea5e9"
opacity="0.15"
filter="url(#strongGlow)">


<animate attributeName="r"
values="70;85;70"
dur="3s"
repeatCount="indefinite"/>


</circle>



<circle
cx="600"
cy="220"
r="45"
fill="none"
stroke="#67e8f9"
stroke-width="3">


<animateTransform
attributeName="transform"
type="rotate"
from="0 600 220"
to="360 600 220"
dur="8s"
repeatCount="indefinite"/>


</circle>



<circle
cx="600"
cy="220"
r="18"
fill="#ffffff"
filter="url(#strongGlow)">


<animate attributeName="opacity"
values="0.5;1;0.5"
dur="2s"
repeatCount="indefinite"/>


</circle>



<text
x="600"
y="225"
text-anchor="middle"
font-family="monospace"
font-size="13"
font-weight="bold"
fill="#020617">

AI

</text>



<!-- LOWER MESSAGE -->


<text
x="600"
y="340"
text-anchor="middle"
font-family="monospace"
font-size="18"
fill="#bae6fd">


DATA • ENGINEERING • AI • PEOPLE • A BETTER TOMORROW

</text>



<text
x="600"
y="385"
text-anchor="middle"
font-family="monospace"
font-size="15"
fill="#94a3b8">


Building intelligent systems that scale

</text>



<!-- SCANNING EFFECT -->


<rect
x="0"
y="0"
width="1200"
height="3"
fill="#38bdf8"
opacity="0.35">


<animate attributeName="y"
values="0;450;0"
dur="7s"
repeatCount="indefinite"/>


</rect>



</svg>
